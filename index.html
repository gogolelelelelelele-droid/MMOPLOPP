<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Jump Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#eee;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:sans-serif}
  canvas{background:#fff;border:2px solid #000;touch-action:manipulation}
  #modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:none;justify-content:center;align-items:center;flex-direction:column;
    color:#fff;text-align:center;padding:20px
  }
  #modal button{
    margin-top:10px;padding:10px 20px;border:none;border-radius:8px;
    font-size:16px;cursor:pointer;
  }
  #updates{
    margin-top:10px;padding:8px 15px;border:none;border-radius:8px;
    font-size:14px;cursor:pointer;background:#555;color:#fff;
  }
</style>
</head>
<body>

<canvas id="game" width="400" height="300"></canvas>

<div id="modal">
  <div id="msg" style="font-size:22px;margin-bottom:8px">باختی! 😅</div>
  <div id="scoreMsg" style="margin-bottom:8px"></div>
  <button id="retry">شروع دوباره</button>
  <button id="updates">بروزرسانی‌های اخیر</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const modal = document.getElementById("modal");
const retryBtn = document.getElementById("retry");
const scoreMsg = document.getElementById("scoreMsg");

let highScore = localStorage.getItem('jumpHighScore') || 0;

// بازیکن
const p={x:50,y:250,s:30,c:"yellow",vy:0,g:0.8,j:-12,gnd:true};
let obs=[],f=0,score=0,dead=false;

function drawP(){
  ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);
  ctx.fillStyle="#000";
  ctx.fillRect(p.x+6,p.y+8,5,5);
  ctx.fillRect(p.x+18,p.y+8,5,5);
}

function newObs(){let h=30+Math.random()*30;obs.push({x:400,y:300-h,w:20,h})}
function drawObs(){ctx.fillStyle="#333";obs.forEach(o=>ctx.fillRect(o.x,o.y,o.w,o.h))}
function updObs(){obs.forEach(o=>o.x-=4);obs=obs.filter(o=>o.x+o.w>0);if(f%90===0)newObs();}

function updP(){
  p.vy+=p.g;p.y+=p.vy;
  if(p.y+p.s>=300){p.y=300-p.s;p.vy=0;p.gnd=true;}
}

function hit(){
  for(let o of obs){
    if(p.x<o.x+o.w&&p.x+p.s>o.x&&p.y<o.y+o.h&&p.y+p.s>o.y)return true;
  }return false;
}

function jump(){
  if(!dead && p.gnd){p.vy=p.j;p.gnd=false;}
}

canvas.addEventListener("touchstart",jump);
canvas.addEventListener("mousedown",jump);

retryBtn.onclick=function(){
  dead=false;modal.style.display="none";
  obs=[];f=0;score=0;p.y=250;p.vy=0;p.gnd=true;
};

(function loop(){
  ctx.clearRect(0,0,400,300);
  if(!dead){
    f++;score++;
    updP();updObs();
    if(hit()){
      dead=true;
      // آپدیت high score
      if(score>highScore){highScore=score; localStorage.setItem('jumpHighScore',highScore);}
      // نمایش مودال
      scoreMsg.innerHTML=`امتیاز این دست: ${score}<br>بالاترین امتیاز: ${highScore}`;
      modal.style.display="flex";
    }
  }
  drawP();drawObs();
  if(!dead){
    ctx.fillStyle="#000";ctx.font="16px sans-serif";
    ctx.fillText("امتیاز: "+score,10,20);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
